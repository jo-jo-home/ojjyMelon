<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Manrope, Arial, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="hero-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="560" cy="60" r="120" fill="#dbeafe" opacity="0.6"/>
  <circle cx="60" cy="380" r="100" fill="#eff6ff" opacity="0.8"/>

  <g filter="url(#soft)">
    <!-- browser window -->
    <rect x="40" y="30" width="560" height="360" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="40" y="30" width="560" height="44" rx="18" fill="#eff6ff"/>
    <rect x="40" y="56" width="560" height="18" fill="#eff6ff"/>
    <circle cx="68" cy="52" r="6" fill="#f97316"/>
    <circle cx="90" cy="52" r="6" fill="#eab308"/>
    <circle cx="112" cy="52" r="6" fill="#22c55e"/>
    <rect x="150" y="42" width="300" height="20" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="166" y="56" font-size="11" fill="#64748b">jo-jo-home.github.io/ojjyMelon</text>

    <!-- melon slice (logo) -->
    <g transform="translate(58,88) scale(0.85)">
      <path d="M6 40 A26 26 0 0 1 58 40 L6 40 Z" fill="#1e3a8a"/>
      <path d="M11 40 A21 21 0 0 1 53 40 L11 40 Z" fill="#2563eb"/>
      <path d="M15 40 A17 17 0 0 1 49 40 L15 40 Z" fill="#93c5fd" opacity="0.35"/>
      <g fill="#eff6ff">
        <ellipse cx="32" cy="28" rx="2.6" ry="4.4"/>
        <ellipse cx="23" cy="34" rx="2.4" ry="4" transform="rotate(18 23 34)"/>
        <ellipse cx="41" cy="34" rx="2.4" ry="4" transform="rotate(-18 41 34)"/>
      </g>
    </g>
    <text x="118" y="122" font-size="22" font-weight="800" fill="#0f172a">ojjy<tspan fill="#2563eb">Melon</tspan></text>

    <!-- grade cards -->
    <g>
      <rect x="64" y="150" width="240" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="82" y="178" font-size="13" font-weight="800" fill="#0f172a">1 — Investigations in Life Science</text>
      <text x="82" y="196" font-size="11" fill="#64748b">Dana Flores</text>
      <text x="82" y="230" font-size="24" font-weight="800" fill="#22c55e">A <tspan font-size="13">96.4%</tspan></text>
      <rect x="170" y="216" width="110" height="12" rx="6" fill="#e2e8f0"/>
      <rect x="170" y="216" width="104" height="12" rx="6" fill="#22c55e"/>
    </g>
    <g>
      <rect x="324" y="150" width="240" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="342" y="178" font-size="13" font-weight="800" fill="#0f172a">3 — Algebra 1A</text>
      <text x="342" y="196" font-size="11" fill="#64748b">Priya Natarajan</text>
      <text x="342" y="230" font-size="24" font-weight="800" fill="#3b82f6">B <tspan font-size="13">87.5%</tspan></text>
      <rect x="430" y="216" width="110" height="12" rx="6" fill="#e2e8f0"/>
      <rect x="430" y="216" width="92" height="12" rx="6" fill="#3b82f6"/>
    </g>
    <g>
      <rect x="64" y="262" width="240" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="82" y="290" font-size="13" font-weight="800" fill="#0f172a">5 — Grade 7 Adv English</text>
      <text x="82" y="308" font-size="11" fill="#64748b">Jordan Ellis</text>
      <text x="82" y="342" font-size="24" font-weight="800" fill="#eab308">C <tspan font-size="13">74.0%</tspan></text>
      <rect x="170" y="328" width="110" height="12" rx="6" fill="#e2e8f0"/>
      <rect x="170" y="328" width="78" height="12" rx="6" fill="#eab308"/>
    </g>
    <g>
      <rect x="324" y="262" width="240" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="342" y="290" font-size="13" font-weight="800" fill="#0f172a">7 — Dig Art Photography 2</text>
      <text x="342" y="308" font-size="11" fill="#64748b">Riley Osei</text>
      <text x="342" y="342" font-size="24" font-weight="800" fill="#22c55e">A <tspan font-size="13">95.0%</tspan></text>
      <rect x="430" y="328" width="110" height="12" rx="6" fill="#e2e8f0"/>
      <rect x="430" y="328" width="102" height="12" rx="6" fill="#22c55e"/>
    </g>

    <!-- floating GPA chip -->
    <g filter="url(#soft)">
      <rect x="452" y="70" width="140" height="64" rx="14" fill="url(#hero-blue)"/>
      <text x="470" y="96" font-size="10" font-weight="800" fill="#dbeafe">GPA · MP1</text>
      <text x="470" y="120" font-size="24" font-weight="800" fill="#ffffff">3.86</text>
    </g>
  </g>
</svg>
