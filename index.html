<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ojjyMelon</title>
<meta name="description" content="ojjyMelon — a third-party app that lets MCPS students view and calculate their grades using Synergy SIS. Stay in control of your grades.">
<meta name="theme-color" content="#3b82f6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ojjyMelon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="assets/fonts/archivo-black.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div id="app">
  <!-- Top Bar -->
  <header id="topbar" class="topbar" hidden>
    <div class="topbar-inner">
      <a href="#/" class="brand" id="brand-link" title="ojjyMelon home">
        <img src="assets/img/logo.svg" alt="ojjyMelon logo" class="brand-logo">
        <span class="brand-name">ojjy<span class="brand-accent">Melon</span></span>
      </a>
      <div class="topbar-actions">
        <button id="install-btn" class="icon-btn" title="Install ojjyMelon" hidden aria-label="Install ojjyMelon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button id="theme-toggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="#/faq" class="icon-btn" title="FAQ" aria-label="FAQ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </a>
        <a href="#/privacy" class="icon-btn" title="Privacy" aria-label="Privacy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </a>
        <div class="avatar-wrap" id="avatar-wrap" hidden>
          <button id="avatar-btn" class="avatar-btn" title="Account" aria-haspopup="true" aria-expanded="false">
            <img id="avatar-img" src="assets/img/default-avatar.svg" alt="Your avatar" class="avatar">
          </button>
          <div id="avatar-menu" class="dropdown" role="menu" hidden>
            <div class="dropdown-header">
              <p id="student-name" class="student-name">Student</p>
              <p id="student-school" class="student-school"></p>
              <p id="student-meta" class="student-meta"></p>
            </div>
            <button class="dropdown-item" id="menu-grades" role="menuitem">My Grades</button>
            <button class="dropdown-item" id="menu-settings" role="menuitem">Settings & Proxy</button>
            <hr class="dropdown-sep">
            <button class="dropdown-item danger" id="logout-btn" role="menuitem">Sign out</button>
          </div>
        </div>
        <button id="login-btn-top" class="btn btn-primary btn-sm" hidden>Sign in</button>
      </div>
    </div>
  </header>

  <!-- Promo banners (PWA / in-app browser) -->
  <div id="promo-host"></div>

  <!-- Layout: sidebar + view -->
  <div id="layout" class="layout">
    <aside id="sidebar" class="sidebar" hidden>
      <nav class="sidebar-nav" aria-label="Main">
        <a href="#/grades?view=card" class="nav-link" data-nav="grades-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Grades <em class="nav-sub">cards</em></span>
        </a>
        <a href="#/grades?view=table" class="nav-link" data-nav="grades-table">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
          <span>Grades <em class="nav-sub">table</em></span>
        </a>
        <a href="#/schedule" class="nav-link" data-nav="schedule">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Schedule</span>
        </a>
        <a href="#/attendance" class="nav-link" data-nav="attendance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 5.5H2v13h20z"/><path d="M2 10.5h20"/><path d="M9 5.5v13"/><path d="M15 5.5v13"/><path d="M9 10.5h6"/></svg>
          <span>Attendance</span>
        </a>
        <a href="#/documents" class="nav-link" data-nav="documents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Documents</span>
        </a>
        <a href="#/faq" class="nav-link" data-nav="faq">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>FAQ</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="sidebar-logout" class="nav-link logout-link" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Log out</span>
        </button>
        <p class="sidebar-note">Not affiliated with Edupoint or MCPS. StudentVUE is a trademark of Edupoint.</p>
      </div>
    </aside>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <!-- Mobile bottom bar -->
  <nav id="mobilebar" class="mobilebar" hidden aria-label="Mobile">
    <a href="#/grades" class="mob-link" data-nav="grades">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      <span>Grades</span>
    </a>
    <a href="#/schedule" class="mob-link" data-nav="schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Schedule</span>
    </a>
    <a href="#/attendance" class="mob-link" data-nav="attendance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 5.5H2v13h20z"/><path d="M2 10.5h20"/><path d="M9 5.5v13"/><path d="M15 5.5v13"/></svg>
      <span>Attendance</span>
    </a>
    <a href="#/documents" class="mob-link" data-nav="documents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Documents</span>
    </a>
  </nav>

  <!-- Toast host -->
  <div id="toast-host" class="toast-host" aria-live="assertive"></div>

  <!-- Modal host -->
  <div id="modal-root"></div>
</div>

<script src="js/main.js" type="module"></script>
</body>
</html>
